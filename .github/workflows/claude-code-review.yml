name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. `synchronize` fires on every push, so without this a
# quick follow-up push leaves two full reviews running against different commits —
# the older one finishes and posts a verdict on code that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts and dependency bumps do not need a full review pass. Draft PRs still
    # fire `opened`, and a bot PR would otherwise be reviewed once per push.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          # The review criteria are NOT authored here. They were — about ninety lines of them —
          # and that made this file the third place the same rules lived, after AGENTS.md and
          # .agents/policies/. A rule added to a policy did not reach the reviewer, and a rule
          # edited here diverged from the policy silently, which is the failure ADR-085 §I.29 and
          # agents-md-schema.md rule 2 exist to prevent. The action checks the repository out, so
          # the routine and the role it names are on disk; this prompt's whole job is to say which
          # one to run.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by running the repository's own review routine.

            1. Read `AGENTS.md`. It is the entry point and it names where the rules live.
               (`CLAUDE.md` is a pointer to it, not a second copy.)
            2. Read `.agents/workflows/sdk-pr-review.md` and follow it, acting as the
               `exeris-sdk-architect` role in `.agents/agents/exeris-sdk-architect/AGENT.md`.
               Read the policies and skills those two files name — the ones your diff actually
               touches — rather than working from memory. Each is the single owner of its list.
            3. Report what the pull request's own check runs say — name and conclusion, as
               reported. This job runs no build and no gate, so there is no exit code to quote and
               inventing one is worse than the gap it fills. A check you could not read is
               `not-run`; so is one that has not finished.

            Post one PR review, not many separate comments. Lead with blockers, then in-scope
            improvements, then non-blocking suggestions, citing `file:line`. End with the verdict
            and, after it, the same content as a fenced `json` block conforming to
            `.agents/schemas/verdict.schema.json`.

          # `gh pr checks` reads this pull request's check runs and nothing else. `gh api` is
          # deliberately NOT here: it is an arbitrary-endpoint grant, mutating endpoints included,
          # and this job runs with `pull-requests: write` as the role the repository declares
          # `mode: read-only`. A reviewer that can close the pull request it is reviewing is not a
          # reviewer.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(git remote:*)"
