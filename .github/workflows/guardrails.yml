# The per-repo footprint of ADR-085 §C.11. Every check it runs is defined in
# exeris-systems/.github; this file only says which gates apply here and how strictly.
#
# Until this landed, the documentation standards were binding and unenforced: a pull request could
# contradict a standard and merge green, and the L2 documentation review existed only inside a
# Cowork session. The Javadoc half is the sharper case — `maven-javadoc-plugin` has run with
# failOnWarnings=true on the publishable modules for several releases and passes clean, which is
# why ADR-085 chose this repository as the Javadoc pilot. That measured one half of the gate. The
# Checkstyle half of javadoc-gate.yml had never been run here at all; when it first was, it
# reported 890 findings across 126 of 132 sources.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares — not a wish list and not a minimum. Omitting a
# permission one of them declares does not run that job with less; it makes the whole file an
# invalid workflow. The last two are docs-review's: `id-token: write` for the OIDC exchange
# claude-code-action performs, `issues: read` so the routine can see the debt issues that
# issue-conventions.md rule 6 says a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# Referenced by branch, not by commit SHA, and that is a choice rather than an oversight.
# exeris-kernel pins these by SHA because SonarCloud is a required check there and enforces it,
# and because its Dependabot configuration is what keeps the pins current. This repository has
# neither: every `uses:` here is tag-referenced (`actions/checkout@v4`) and there is no
# dependabot.yml. A SHA pinned by hand in a repository with nothing to advance it does not buy
# immutability, it buys a gate frozen at whatever the bundle looked like on the day someone typed
# it — silently, since a SHA tells a reader nothing. `@main` is the form the bundle's own install
# instructions give, and it is honest about what this repository actually tracks. Revisit together
# with adopting Dependabot, not before.

jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      # strict, not ramp. The bundle's default is ramp — fail only on files the pull request
      # touches — because most repositories carry a frontmatter backlog the current author did not
      # create. That reasoning does not apply by the time this file merges: the backfill lands
      # first and this caller lands last, so there is no backlog left for ramp to shield. If a
      # backfill PR slips out of the 0.12 window, drop this to `ramp` rather than dropping the job.
      mode: strict
      # Off, and it stays off: the check enforces ## Contract / ## Hot path / ## Failure modes /
      # ## Owning ADRs on pages typed `subsystem` or `module`, and docs/ here holds only adr/ and
      # rfc/. Turning it on would assert something about a page set that does not exist.
      section-check: false
      # No path list: docs-lint reads the whole repository and skips what is not documentation
      # (generated output, agent trees, "_"-prefixed working directories) — and, since
      # exeris-systems/.github#19, anything `.gitattributes` marks `linguist-generated`, which is
      # how `exeris-sdk-ui-kit/api/ui-kit.api.md` is skipped. That report is api-extractor's output,
      # committed on purpose because it is that package's japicmp (§F.21c), and a frontmatter block
      # in it would not survive the next `npm run api:accept`. No `exclude` list here: measured on
      # this tree with the current script, 25 files / 0 errors without one.
      #
      # `agent-check` is left at its default `true` — the agent-layer half of §I.29 is not optional
      # here, and this repository has an `.agents/` tree to check.
      #
      # `agents-ref` is NOT left at its default `main`. The tooling that checks the agent layer and
      # the semantics it checks are one contract at one version — the reason §C.11 puts them in a
      # repository that has a SemVer at all — so it is pinned to the same commit `.agents/manifest.yaml`
      # vendors. Running the checker from `main` would let a bundle release change what this
      # repository's CI enforces without this repository moving, which is the moving target rule 8
      # forbids one level down. Bumping the bundle means editing both, and the digest check fails
      # loudly if only one moves.
      agents-ref: 628cf11b4c4d3ecafadfe07b18764e75598ebd46
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # The L2 review of ADR-085 §J.33, and not the same thing as claude-code-review.yml: that
  # workflow reviews the change, this one checks the change against the documentation standards.
  # Skips itself when no Markdown or Java changed.
  docs-review:
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@main
    # Named, not `secrets: inherit`. This repository publishes to Maven Central as of 0.12.0, so
    # its secret set now includes a GPG signing key and a Central portal token; `inherit` would
    # hand all of them to a job that needs exactly one.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  # ADR-085 §F.21. Two halves, and both have to be green before 0.12.0 ships, because a Javadoc
  # defect ships INSIDE the -javadoc.jar and a version on Central is permanent.
  #
  # `modules` is every jar this reactor publishes. `exeris-sdk-bom` and `exeris-sdk-parent` are
  # pom-packaged and have nothing to document.
  #
  # `build-modules` carries `exeris-sdk-annotation-catalog`, which the gate has to BUILD and has no
  # reason to CHECK. The module holds itself back from deploy (maven.deploy.skip in its own pom),
  # so "every module published to Maven Central" does not reach it; `exeris-sdk-annotations`
  # consumes it as an annotation processor through <annotationProcessorPaths>, which Maven does not
  # treat as a reactor dependency edge — the root pom's <modules> comment says so and orders the
  # declaration to compensate, which only helps a full reactor build. `-pl <modules> -am` neither
  # selects nor reaches it, so the first run here died in the install step with "Could not find
  # artifact eu.exeris:exeris-sdk-annotation-catalog:jar:0.12.0-SNAPSHOT" before reaching a doc
  # comment. Naming it in `modules` fixed the build and bought a cost — the gate then also graded a
  # build-time module the standard does not ask about. `build-modules` is the separation, and it
  # exists because that cost was reported rather than absorbed twice.
  #
  # `trivial-accessors: exempt` opts out of the Checkstyle half of rule 1 for single-line bodies,
  # and the opt-out is narrow and covered rather than convenient. Measured on this reactor with the
  # pinned 13.8.0: `documented` (the default) reports 204 errors, every one a fluent builder setter
  # of the shape `public Builder x(T v) { this.x = v; return this; }`; `exempt` reports 0. Two
  # things already cover them, and both are stricter than what is being dropped —
  # `maven-javadoc-plugin` runs doclint with failOnWarnings, and `JavadocCompletenessTest` requires
  # a doc comment on every public member of `source-model` EXCEPT a setter whose body is exactly
  # that assignment, with the assigned field back-referenced to the method name. Checkstyle cannot
  # express a body shape; the test can, and does. Documenting the 204 instead would put 204 comments
  # restating `this.x = v` into a -javadoc.jar on Central, permanently.
  #
  # `extra-maven-args` carries `-Djapicmp.skip=true`, the same flag build.yml, release.yml and
  # release-assets.yml pass, for the reason the root POM's japicmp comment gives in full: the 0.11.0
  # baseline is not on Central and 0.12.0 is the first version that will be. japicmp binds to
  # `verify`, which `install` runs, so without it the gate dies on an artifact resolution before
  # reading a doc comment. All four callers say it now, in the same words, and they come off together
  # when the 0.13.0 line opens.
  #
  # No dedicated profile: unlike the kernel, the strict Javadoc settings here live unconditionally
  # in each module's own pom and the `release` profile deliberately does not relax them, so the gate
  # runs exactly the configuration a release runs. The one thing that had to change in the root pom
  # for this job is the jacoco.skip line — see its comment there.
  javadoc:
    uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@main
    with:
      modules: exeris-sdk-annotations,exeris-sdk-source-model,exeris-sdk-source-model-io,exeris-sdk-composition-spec,exeris-sdk-composition-lifecycle,exeris-sdk-composition-runtime,exeris-sdk-tck
      build-modules: exeris-sdk-annotation-catalog
      trivial-accessors: exempt
      extra-maven-args: -Djapicmp.skip=true
  # ADR-085 §F.21a–c. The TypeScript half of the same rule, and this repository owns one of the
  # three surfaces the ADR names by hand: `@exeris-systems/ui-kit`.
  #
  # `lint-scope: package`, not `diff`. The bundle offers `diff` for Angular applications and
  # internal tooling — rule 11 — where a backlog nobody in the current pull request created would
  # otherwise block it. That is not the situation here: the package's whole TypeScript surface is
  # one file, and it reaches this workflow already at zero. There is no backlog for `diff` to
  # shield, so scoping the lint to changed files would only mean a later change elsewhere in the
  # file goes unchecked.
  #
  # All three checks are on because all three are what §F.21c asks of a published library:
  # typedoc's `notDocumented` over the entry point (rule 1), and api-extractor's report against the
  # committed `api/ui-kit.api.md` (rules 7–8), which is this package's japicmp. It matters more here
  # than the name suggests — ui-kit versions independently of the Java artifacts and its 1.0 freezes
  # names rather than values, so the golden is the only thing that can tell a rename from an
  # addition. `build-command` is left at its default `npm run build`, which is `tsc`; the .d.ts it
  # emits is what api-extractor reads.
  tsdoc:
    uses: exeris-systems/.github/.github/workflows/tsdoc-gate.yml@main
    with:
      package-dir: exeris-sdk-ui-kit
      lint-scope: package
      typedoc: true
      api-report: api-extractor
