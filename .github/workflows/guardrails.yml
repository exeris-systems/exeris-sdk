# The per-repo footprint of ADR-085 §C.11. Every check it runs is defined in
# exeris-systems/.github; this file only says which gates apply here and how strictly.
#
# It runs the organisation's documentation, commit and pull-request gates on every pull request,
# and the review that composes them into one verdict.
#
# THIS FILE CARRIES `claude-code-action`, which refuses to start when the workflow it runs under
# differs in any byte from the copy on the default branch, and reports that refusal as a successful
# skip. A pull request that edits this file therefore gets no review. So configuration that moves
# with the tree lives in workflow files of its own: the Javadoc gate in `javadoc.yml`, the TSDoc
# gate in `tsdoc.yml`. What stays here is the part that changes when the organisation's routine
# does, not when a module is added.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    #
    # `closed` is not a gate event and is here for one job: the judgement of ADR-087 §C.16, which
    # reads what the human did with the review once there is a history to read. Every other job
    # skips it explicitly — a gate on a pull request that can no longer merge decides nothing.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing. Bot-triggered runs queue instead of cancelling; human
  # pushes still collapse.
  # The close is kept out of the collapse by its own clause: the human who merges is no `[bot]`, so
  # without it the merge cancels the run still publishing the verdict and the judgement after it.
  cancel-in-progress: ${{ github.event.action != 'closed' && !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares — not a wish list and not a minimum. Omitting a
# permission one of them declares does not run that job with less; it makes the whole file an
# invalid workflow. The last two are review's: `id-token: write` for the OIDC exchange
# claude-code-action performs, `issues: read` so the routine can see the debt issues that
# issue-conventions.md rule 6 says a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  # `actions: read` belongs to `judge` alone: the judgement compares the commit a review READ with
  # the head the pull request ended at, and the first is the reviewing run's own `head_sha`, which
  # the platform states on the Actions API and nowhere else independent of the record being judged.
  actions: read

# Referenced by branch, not by commit SHA, and that is a choice rather than an oversight. Every
# third-party and GitHub-owned action in this repository is SHA-pinned, because `dependabot.yml`
# advances those pins to each new release tag. It cannot advance these: exeris-systems/.github
# publishes no tags, so a SHA here would only ever move by hand. A pin nothing advances does not
# buy immutability, it buys a gate frozen at whatever the bundle looked like on the day someone
# typed it — silently, since a SHA tells a reader nothing. `@main` is the form the bundle's own
# install instructions give, and it is honest about what this repository actually tracks: a merge
# to that repository's `main` is a deployment to every caller.

jobs:
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      # strict, not ramp. The bundle's default is ramp — fail only on files the pull request
      # touches — which shields a frontmatter backlog the current author did not create. This
      # repository carries no such backlog, so ramp would shield nothing and only let an untouched
      # file drift. If a backlog ever appears, drop this to `ramp` rather than dropping the job.
      mode: strict
      # Off, and it stays off: the check enforces ## Contract / ## Hot path / ## Failure modes /
      # ## Owning ADRs on pages typed `subsystem` or `module`, and docs/ here holds only adr/ and
      # rfc/. Turning it on would assert something about a page set that does not exist.
      section-check: false
      # No path list: docs-lint reads the whole repository and skips what is not documentation
      # (generated output, agent trees, "_"-prefixed working directories) — and anything
      # `.gitattributes` marks `linguist-generated`, which is
      # how `exeris-sdk-ui-kit/api/ui-kit.api.md` is skipped. That report is api-extractor's output,
      # committed on purpose because it is that package's japicmp (§F.21c), and a frontmatter block
      # in it would not survive the next `npm run api:accept`. No `exclude` list: every other
      # documentation file in this repository is expected to pass as written.
      #
      # `agent-check` is left at its default `true` — the agent-layer half of §I.29 is not optional
      # here, and this repository has an `.agents/` tree to check.
      #
      # `agents-ref` is left at its default `main`, and that is the second time this file makes the
      # same call for the same reason as the `uses:` comment above. Pinning to a commit in this file
      # creates a gap: **nothing verifies the two agree** — the digest check compares the vendored
      # tree against the pin inside `manifest.yaml` and never reads this file, so a hand-typed SHA
      # here can drift from the vendored one indefinitely and every check stays green. A pin whose
      # only enforcement is that someone remembers is the frozen-and-silent gate rejected above.
      #
      # The cost of `main` is accepted knowingly: a bundle release can change what this
      # repository's CI enforces without this repository moving. That trade is better than a
      # drifted pin that nobody catches, which would silently relax checks that the vendored tree
      # claims to enforce.
      #
      # The fix belongs upstream, in one line: `docs-lint` can read `imports[].ref` out of the
      # consuming repository's own `manifest.yaml` and check the bundle out at that, which is the
      # only arrangement in which the two cannot disagree. Reported.
  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B: one
  # routine, one verdict, one publisher. The shared routine judges the pull request, its pages, its
  # records, the comments in its code and what the code does; this repository's own rules reach it
  # as `repo-routine`.
  #
  # `needs` puts it after the gates it complements and `l1-results` hands it their conclusions:
  # the reviewer's harness denies the network, so a gate it is asked to read for itself lands in the
  # verdict as `not-run`. `always()`, because a review that vanishes from the checks when its gates
  # go red is the failure this arrangement exists to prevent. A bot's event runs the job too: the
  # publishing half answers it from the standing verdict, and the model does not start on one.
  #
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, reopened,
  # marked ready for review, or labelled `needs-review` by a person. A push afterwards leaves the
  # standing verdict covering an older commit, and the check says so until a review is asked for
  # again.
  review:
    needs: [docs, commits, pr-body]
    if: ${{ always() && github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/review.yml@main
    with:
      # `review / verdict` is the check this adds, red when the verdict is BLOCKED,
      # absent, invalid, or resting on a mandatory gate that did not run. It is not a required
      # context here; making it one is a branch-protection change, not a change to this file.
      publish: true
      # CAPTURE IS THE SECOND OPT-IN, and a separate decision from the first. With it on, the run
      # becomes a row in the organisation's execution dataset (ADR-087 §C.13-§C.17): the runner's
      # execution log is committed to the streams repository as content, a run record is assembled
      # from what the producing job exported about itself, and the day's rows reach the inbox as
      # one pull request per repository per day.
      #
      # IT RUNS INSIDE THE PUBLISHING HALF, so it needs `publish: true` as well: with publication
      # off there is no job for it to be a part of, and `capture: true` alone runs nothing and
      # says nothing about having run nothing.
      #
      # It needs the two EXERIS_INBOX_* secrets below and NO new permission: the capture job reads
      # the repository and the pull request, both of which the block at the top already grants, and
      # every write goes through the App's installation token. Without the secrets the job reports
      # that it has no identity to write under and writes nothing; the review and its gate are
      # unaffected either way.
      capture: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's own rules, applied after the shared routine's parts and under its
      # severity tags and verdict schema. Read at the BASE commit, never at the pull request's ref:
      # a pull request does not write the rules it is judged by.
      repo-routine: docs/repo-review-rules.md
      # One model run per part, composed into one verdict and one comment. `pr` and `repo` run on
      # every pull request; `docs`, `records`, `code-docs` and `code` where the diff has their
      # files. A part that leaves no verdict makes the check red.
      review-in-parts: true
    # Named, not `secrets: inherit`. This repository publishes to Maven Central, so
    # its secret set includes a GPG signing key and a Central portal token; `inherit` would hand all
    # of them to a job that needs five.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      # THE PEN, which `capture: true` above writes with. A caller may pass only a secret the called
      # workflow DECLARES: one it does not declare is not ignored, it makes the whole file an
      # invalid workflow in the adopting repository, on the first push, with no logs — taking every
      # gate in this file down with it, not only this job.
      #
      # They are optional exactly as the two lines above are: an organisation secret that is not set
      # arrives as an empty string, and the capture job then says so and writes nothing. They are
      # named rather than inherited for the reason the others are.
      exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
  # The other half of the record, and the only job here that runs on `closed`. A review-domain run
  # record is complete when the review ends and its outcome is `UNKNOWN`: the oracle has not judged
  # yet. `review-disposition` judges when the pull request closes — per finding, from what the human
  # did with it — and its verdict is appended as its own record keyed by the run's id (ADR-087
  # §C.16). It is not a gate: the pull request is closed, it publishes no check a branch protection
  # rule can name, and it posts nothing to the pull request.
  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
