name: publish-ui-kit

# Publishes @exeris/ui-kit to the public npm registry (registry.npmjs.org).
#
# The package is public so that a generated application — and `@exeris/codegen-ts`, which emits
# the dependency — installs it with no `.npmrc` entry and no token. It versions independently of
# the Java modules (MIGRATION-0.x-to-1.0.md §2b), so it has its own tag.
#
# Trigger: a `ui-kit-v<version>` tag (e.g. ui-kit-v0.1.0) publishes. A manual dispatch is a dry
# run unless `dry-run` is unchecked: it installs, gates and runs `npm publish --dry-run`, which
# prints the tarball and touches nothing remote. Bump exeris-sdk-ui-kit/package.json `version`
# before tagging — npm refuses to publish over an existing version.
#
# Auth: the `NPM_TOKEN` repository secret, an npm granular access token with publish rights on
# the @exeris scope. `publishConfig.provenance` signs a provenance statement through this
# workflow's OIDC token (`id-token: write`), so the registry shows which commit and workflow
# built the tarball.

on:
  push:
    tags:
      - 'ui-kit-v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run: gate and `npm publish --dry-run`, publish nothing. Uncheck only to publish without a tag.'
        type: boolean
        default: true
      dist-tag:
        description: 'npm dist-tag to publish under'
        default: 'latest'
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish @exeris/ui-kit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catch a tag/version mismatch early with a clear message, instead of the
      # cryptic late failure from `npm publish` ("cannot publish over previously
      # published versions" — or a silent wrong-version publish).
      - name: Assert tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: exeris-sdk-ui-kit
        run: |
          TAG="${GITHUB_REF_NAME#ui-kit-v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "Tag version $TAG != package.json $PKG"; exit 1; }

      - name: Set up Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@exeris'
          cache: npm
          cache-dependency-path: exeris-sdk-ui-kit/package-lock.json

      # The same gates the PR build runs on this package: per-file coverage, the API golden and
      # the typedoc check. `prepublishOnly` builds dist/ right before `npm publish`, and `prepack`
      # copies the repository LICENSE into the tarball.
      - name: Install + gate
        working-directory: exeris-sdk-ui-kit
        run: |
          npm ci
          npm run test:coverage
          npm run build
          npm run api:check
          npm run docs:check

      - name: Publish to npm
        working-directory: exeris-sdk-ui-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --tag "$DIST_TAG"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm granular access token with publish rights on @exeris as the NPM_TOKEN repository secret. Nothing was published." >&2
            exit 1
          fi
          npm publish --tag "$DIST_TAG"
