name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the kernel's GA baseline (ADR-069), and
        # the toolchain a published artifact must come from. 26 stays as a
        # forward-compatibility row: it catches source that stops compiling on a
        # newer JDK, which a single-row matrix would surface only downstream.
        java: ['25', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node 20 (for ui-kit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: exeris-sdk-ui-kit/package-lock.json

      # japicmp.skip: the semver gate compares against the last released jar, and
      # that baseline — 0.11.0 — was never published to Maven Central: 0.6.0–0.11.0
      # shipped as git tag + GitHub Release only, and nothing is backfilled. A CI
      # runner therefore has no baseline to resolve, and the gate is configured to
      # fail rather than treat an absent baseline as "no breaks found". It runs
      # locally only where 0.11.0 has been installed into ~/.m2. The flag comes off
      # when the 0.13.0 line opens against a 0.12.0 baseline Central can serve —
      # the Central wiring has already landed, so that is not what turns the gate
      # on. release.yml, release-assets.yml and guardrails.yml carry the same flag
      # for the same reason; the root POM's japicmp comment is canonical.
      #
      # The half of the record-growth stance that needs no baseline —
      # RecordComponentOrderTest and AnnotationSurfaceContractTest — runs here
      # unconditionally as an ordinary test.
      - name: mvn -B verify (runs Java tests + JaCoCo 85% gate)
        run: mvn -B -ntp verify -Djapicmp.skip=true

      - name: ui-kit npm test (Vitest + 85% coverage gate)
        working-directory: exeris-sdk-ui-kit
        run: |
          npm ci
          npm run test:coverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-source-model-jdk${{ matrix.java }}
          path: exeris-sdk-source-model/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload ui-kit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-kit-coverage-jdk${{ matrix.java }}
          path: exeris-sdk-ui-kit/coverage/
          if-no-files-found: warn
