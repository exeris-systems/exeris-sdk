name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the kernel's GA baseline (ADR-069), and
        # the toolchain a published artifact must come from. 26 stays as a
        # forward-compatibility row: it catches source that stops compiling on a
        # newer JDK, which a single-row matrix would surface only downstream.
        java: ['25', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node 24 (for ui-kit tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exeris-sdk-ui-kit/package-lock.json

      # -Psemver runs japicmp against the last release, `japicmp.baseline.version` in the root
      # pom, which Maven Central serves; a binary-incompatible change outside the record-growth
      # stance fails the build. The half of the stance that needs no baseline —
      # RecordComponentOrderTest, RecordConstructorLedgerTest and
      # AnnotationSurfaceContractTest — runs as ordinary tests.
      - name: mvn -B verify (Java tests, JaCoCo 85% gate, semver gate)
        run: mvn -B -ntp -Psemver verify

      - name: ui-kit npm test (Vitest + 85% coverage gate)
        working-directory: exeris-sdk-ui-kit
        run: |
          npm ci
          npm run test:coverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-source-model-jdk${{ matrix.java }}
          path: exeris-sdk-source-model/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload ui-kit coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-kit-coverage-jdk${{ matrix.java }}
          path: exeris-sdk-ui-kit/coverage/
          if-no-files-found: warn
