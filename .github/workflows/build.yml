name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the kernel's GA baseline (ADR-069), and
        # the toolchain a published artifact must come from. 26 stays as a
        # forward-compatibility row: it catches source that stops compiling on a
        # newer JDK, which a single-row matrix would surface only downstream.
        java: ['25', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node 24 (for ui-kit tests)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exeris-sdk-ui-kit/package-lock.json

      # No semver gate here, and no flag needed to leave it out: japicmp runs only under the
      # root pom's opt-in `semver` profile, and its configured baseline is not one Maven Central
      # serves, so a runner could not resolve it. Once the baseline is on Central, adding
      # -Psemver to this step and to release.yml is the single edit that starts 1.x binary
      # enforcement; the root pom's japicmp comment and the ROADMAP say when.
      #
      # The half of the record-growth stance that needs no baseline —
      # RecordComponentOrderTest, RecordConstructorLedgerTest and
      # AnnotationSurfaceContractTest — runs here unconditionally as ordinary tests.
      - name: mvn -B verify (runs Java tests + JaCoCo 85% gate)
        run: mvn -B -ntp verify

      - name: ui-kit npm test (Vitest + 85% coverage gate)
        working-directory: exeris-sdk-ui-kit
        run: |
          npm ci
          npm run test:coverage

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-source-model-jdk${{ matrix.java }}
          path: exeris-sdk-source-model/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload ui-kit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-kit-coverage-jdk${{ matrix.java }}
          path: exeris-sdk-ui-kit/coverage/
          if-no-files-found: warn
